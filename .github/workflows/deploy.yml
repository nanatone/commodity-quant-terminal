name: Auto Fetch Commodity Data & Deploy to GitHub Pages

on:
  workflow_dispatch: # 支持在 GitHub 页面手动一键触发
  push:
    branches: [ main, master ]
  schedule:
    # 每个交易日北京时间 08:30 (UTC 00:30), 11:35 (UTC 03:35), 15:15 (UTC 07:15) 自动拉取更新
    - cron: '30 0 * * 1-5'
    - cron: '35 3 * * 1-5'
    - cron: '15 7 * * 1-5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'scripts/requirements.txt'

      - name: 3. Install Python Quant & Data Dependencies
        run: |
          pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: 4. Run Macro & 60m Quant Fetch Script
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python scripts/fetch_data.py

      - name: 5. Commit Updated market_data.json Back to Repo
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/market_data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto update commodity basis & 60m quant signals" && git push)

      - name: 6. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 7. Install Frontend Dependencies & Build Vite Bundle
        run: |
          npm install
          npm run build

      - name: 8. Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: 9. Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: 10. Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
